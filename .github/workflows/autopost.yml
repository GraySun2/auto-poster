# Posts the next video in autopost/queue.json when one of the times in autopost/config.json comes round.
# Runs twice an hour; most runs find nothing due and finish in seconds. See README.md.
# Pause: set the repository variable AUTOPOST_MODE to "off" (or turn this workflow off in the Actions tab).
name: Autopost

on:
  schedule:
    # GitHub runs scheduled jobs on a best-effort basis and drops some, so this checks twice an hour;
    # a slot that is missed still posts within catchUpHours (and with YouTube scheduleAheadHours, it is
    # already uploaded with its publish time).
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [post-if-due, post-now, check, status]
        default: post-if-due
      mode:
        description: "Mode for this run (setting = use the AUTOPOST_MODE variable)"
        type: choice
        options: [setting, dry-run, test, live]
        default: setting
      account:
        description: "post-now only: which account (empty = whichever is next in the queue)"
        type: string
        required: false

permissions:
  contents: write   # only to save the posting log on the autopost-log branch

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTOPOST_MODE: ${{ vars.AUTOPOST_MODE }}
      AUTOPOST_MODE_OVERRIDE: ${{ (inputs.mode && inputs.mode != 'setting') && inputs.mode || '' }}
      AUTOPOST_POST_NOW: ${{ inputs.action == 'post-now' }}
      # Every secret and variable goes to the job as JSON, so an account added in config.json needs no
      # change here. GitHub still blanks each secret out of the logs.
      AUTOPOST_SECRETS: ${{ toJSON(secrets) }}
      AUTOPOST_VARS: ${{ toJSON(vars) }}
      AUTOPOST_ADMIN_TOKEN: ${{ secrets.AUTOPOST_ADMIN_TOKEN }}
      AUTOPOST_ACCOUNT: ${{ inputs.account }}
    steps:
      # Only the autopost folder comes down at first; the one video being posted is added later,
      # so a repository full of videos stays quick to check out.
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            autopost
            .github

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read the posting log
        run: |
          mkdir -p .autopost-state
          if git fetch -q origin autopost-log 2>/dev/null; then
            git show FETCH_HEAD:log.json > .autopost-state/log.json
            git rev-parse FETCH_HEAD > .autopost-state/parent
          fi

      - name: Check sign-ins
        if: inputs.action == 'check'
        run: node autopost/autopost.mjs check

      - name: Status
        if: inputs.action == 'status'
        run: node autopost/autopost.mjs status

      - name: Decide
        id: plan
        if: inputs.action != 'check' && inputs.action != 'status'
        run: node autopost/autopost.mjs plan

      - name: Get the video
        if: steps.plan.outputs.job == 'post' || steps.plan.outputs.job == 'retry'
        env:
          DIRS: ${{ steps.plan.outputs.dirs }}
        run: echo "$DIRS" | xargs -d '\n' git sparse-checkout add

      - name: Post
        if: steps.plan.outputs.job == 'post' || steps.plan.outputs.job == 'retry'
        run: |
          # ffmpeg lays a queue item's overlay over its video; GitHub's Ubuntu runners usually have it.
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          node autopost/autopost.mjs run

      - name: Save the posting log
        if: always() && hashFiles('.autopost-state/log.json') != ''
        run: |
          cd .autopost-state
          git config user.name "autopost"
          git config user.email "autopost@users.noreply.github.com"
          blob=$(git hash-object -w log.json)
          tree=$(printf '100644 blob %s\tlog.json\n' "$blob" | git mktree)
          parent=$(cat parent 2>/dev/null || true)
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then echo "log unchanged"; exit 0; fi
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "Posting log: $(date -u +%FT%TZ)")
          git push -q origin "$commit:refs/heads/autopost-log"
